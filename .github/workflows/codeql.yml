name: CodeQL
run-name: "CodeQL — ${{ github.event_name }}"

# Code scanning in advanced setup (docs/CI.md, Code scanning; SECURITY.md).
# GitHub's default setup must stay off: it cannot run beside this workflow.
# Analyses the Python tooling, the label scripts (javascript-typescript) and
# the workflows (actions) with the security-extended queries.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # A scheduled event may not carry the repository payload, so the
    # visibility is read from the API. Code scanning results can only be
    # uploaded for a public repository on this plan.
    name: Check repository visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - name: Read the visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          echo "Repository visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Code scanning skipped: the repository is $visibility"
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: gate
    if: needs.gate.outputs.public == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyse and upload
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-pr:
    name: Analyze pull request (${{ matrix.language }})
    needs: gate
    if: needs.gate.outputs.public == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyse without uploading
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          upload-database: false
          output: codeql-results
      - name: Keep SARIF results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-pr-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 30
