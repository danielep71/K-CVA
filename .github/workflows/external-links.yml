name: External links
run-name: "External links — ${{ github.event_name }}"

# Weekly report of broken http(s) links in the tracked Markdown
# (tools/check_external_links.py; docs/CI.md, Markdown links). Not run on pull
# requests and not a required check: an outside site may be down without any
# change here. A broken link fails this run, so it shows in the Actions list;
# sites that refuse automated checks are listed as unverified.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: true

jobs:
  check:
    name: Check external links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install the hash-locked Python packages
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r tools/requirements.txt
      - name: Check the external links
        run: python tools/check_external_links.py --summary "$GITHUB_STEP_SUMMARY"
