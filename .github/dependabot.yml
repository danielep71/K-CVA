version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [danielep71]
    labels: [ci, P3]
    commit-message:
      prefix: chore
  - package-ecosystem: pip
    directory: /tools
    target-branch: release/0.1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [danielep71]
    labels: [ci, P3]
    commit-message:
      prefix: chore
